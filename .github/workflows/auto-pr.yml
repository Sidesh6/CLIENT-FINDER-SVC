name: Auto Create Pull Request

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
      - "docs/**"
      - "test/**"
    # Don't run on main or develop branches
    branches-ignore:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Check if PR already exists
        id: check_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ steps.branch.outputs.branch_name }}`,
              state: 'open'
            });
            if (pulls.length > 0) {
              console.log(`PR already exists: #${pulls[0].number}`);
              core.setOutput('pr_exists', 'true');
              core.setOutput('pr_number', pulls[0].number);
            } else {
              core.setOutput('pr_exists', 'false');
            }

      - name: Create Pull Request
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = '${{ steps.branch.outputs.branch_name }}';

            // Generate PR title from branch name
            const title = branchName
              .replace(/^(feature|fix|chore|refactor|docs|test)\//, '')
              .replace(/[-_]/g, ' ')
              .replace(/\b\w/g, l => l.toUpperCase());

            // Generate PR body
            const body = `## Automated Pull Request

This PR was automatically created from branch: \`${branchName}\`

### Changes
- This PR contains commits pushed to the feature branch
- CI tests will run automatically

### Checklist
- [ ] Tests pass
- [ ] Code follows project style guidelines
- [ ] Documentation updated if needed

---
*This PR was created automatically by GitHub Actions*`;

            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: branchName,
              base: 'main',
              body: body,
              draft: false
            });

            console.log(`Created PR #${pullRequest.number}: ${pullRequest.html_url}`);
            core.setOutput('pr_number', pullRequest.number);
            core.setOutput('pr_url', pullRequest.html_url);

      - name: Add PR labels
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['automated', 'needs-review'];
            const branchName = '${{ steps.branch.outputs.branch_name }}';

            // Add type label based on branch prefix
            if (branchName.startsWith('feature/')) labels.push('feature');
            else if (branchName.startsWith('fix/')) labels.push('bugfix');
            else if (branchName.startsWith('docs/')) labels.push('documentation');
            else if (branchName.startsWith('refactor/')) labels.push('refactor');
            else if (branchName.startsWith('test/')) labels.push('testing');
            else if (branchName.startsWith('chore/')) labels.push('chore');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-pr.outputs.pr_number }},
              labels: labels
            });

            console.log(`Added labels: ${labels.join(', ')}`);
[project]
name = "client-finder-svc"
version = "0.1.0"
description = "AI-powered system for discovering public project opportunities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "colorama==0.4.6",
    "fastapi>=0.110.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "pytest==9.1.1",
    "pymongo>=4.6.0",
    "python-dotenv==1.2.2",
    "soupsieve==2.9.2",
    "sqlalchemy>=2.0.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.5.0",
    "mypy==1.10.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.15.1",
    "mongomock>=4.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "dist",
    "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "src.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]